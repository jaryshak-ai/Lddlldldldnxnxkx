              private void openMenu(Player p) {
                  FormWindowSimple w = new FormWindowSimple("Лорд Тьмы", "Босс-ивент Eclips");
                  w.addButton(new ElementButton("Информация о боссе"));
                  w.addButton(new ElementButton("Телепортация на ивент"));
                  forms.put(w, 1);
                  p.showFormWindow(w);
              }

              private void openInfo(Player p) {
                  FormWindowSimple w = new FormWindowSimple("Лорд Тьмы: информация", infoText());
                  w.addButton(new ElementButton("Назад"));
                  forms.put(w, 2);

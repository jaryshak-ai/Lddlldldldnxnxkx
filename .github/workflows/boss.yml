              @EventHandler
              public void onForm(PlayerFormRespondedEvent e) {
                  Integer kind = forms.remove(e.getWindow());
                  if (kind == null) {
                      return;
                  }
                  Player p = e.getPlayer();
                  if (e.wasClosed() || !(e.getResponse() instanceof FormResponseSimple)) {
                      return;
                  }
                  int id = ((FormResponseSimple) e.getResponse()).getClickedButtonId();
                  if (kind == 1) {
                      if (id == 0) {
                          openInfo(p);
                      } else {
                          teleportToEvent(p);
                      }
                  } else if (kind == 2) {
                      openMenu(p);
                  } else if (p.hasPermission("eclips.boss.admin")) {
                      if (kind == 10) {
                          adminAction(p, id);
                      } else if (kind == 11 || kind == 12) {
                          openAdminMenu(p);
                      }
                  }
              }

              private void teleportToEvent(Player p) {
                  if (phase == PHASE_FIGHT) {
                      p.sendMessage(PREFIX + "§cТелепортация закрыта: босс уже появился.");
                      return;
                  }
                  if (phase == PHASE_IDLE) {
                      p.sendMessage(PREFIX + "§cСейчас ивента нет. Следующий: §f" + nextOpenText() + "§c.");
                      return;
                  }
                  Level lv = spawnLevel();
                  if (lv == null) {
                      p.sendMessage(PREFIX + "§cМир ивента не найден, сообщи администратору.");
                      return;
                  }
                  double min = getConfig().getDouble("event.teleport-min", 10);
                  double max = Math.max(min, getConfig().getDouble("event.teleport-max", 15));
                  double ang = rnd.nextDouble() * Math.PI * 2;
                  double r = min + rnd.nextDouble() * (max - min);
                  double x = getConfig().getDouble("spawn.x", 0.5) + Math.cos(ang) * r;
                  double z = getConfig().getDouble("spawn.z", 0.5) + Math.sin(ang) * r;
                  double y = getConfig().getDouble("spawn.y", 70);
                  lv.loadChunk(((int) Math.floor(x)) >> 4, ((int) Math.floor(z)) >> 4);
                  Position dest = new Position(x, y, z, lv);
                  p.teleport(dest);
                  p.sendMessage(PREFIX + "§aТы на ивенте. Удачи в бою!");
              }

              // ------------------------------------------------------------------ events

              // protection: no PvP in the event zone, boss immune to environment
              @EventHandler(priority = EventPriority.HIGH, ignoreCancelled = true)
              public void onDamage(EntityDamageEvent e) {
                  // boss melee hits only its target (area skills hit everyone)
                  if (phase == PHASE_FIGHT && boss != null && e instanceof EntityDamageByEntityEvent && e.getEntity() instanceof Player
                          && ((EntityDamageByEntityEvent) e).getDamager() == boss
                          && getConfig().getBoolean("ai.melee-only-target", true)
                          && validTarget(target) && e.getEntity() != target) {
                      e.setCancelled(true);
                      return;
                  }
                  // boss and its minions hit harder
                  if (phase == PHASE_FIGHT && e instanceof EntityDamageByEntityEvent && e.getEntity() instanceof Player) {
                      Entity dm = ((EntityDamageByEntityEvent) e).getDamager();
                      if (dm != null && (dm == boss || minionIds.contains(dm.getId()))) {
                          e.setDamage(e.getDamage() * (float) getConfig().getDouble("boss.damage-multiplier", 1.2));
                      }
                  }
                  if (e instanceof EntityDamageByEntityEvent && e.getEntity() instanceof Player) {
                      Entity d = ((EntityDamageByEntityEvent) e).getDamager();
                      if (d instanceof Player && inZone((Player) e.getEntity())) {
                          e.setCancelled(true);
                          return;
                      }
                  }
                  if (phase != PHASE_FIGHT || boss == null || e.getEntity() != boss) {
                      return;
                  }
                  EntityDamageEvent.DamageCause c = e.getCause();
                  String cname = c.name();
                  if (c == EntityDamageEvent.DamageCause.FIRE || c == EntityDamageEvent.DamageCause.FIRE_TICK
                          || c == EntityDamageEvent.DamageCause.LAVA || c == EntityDamageEvent.DamageCause.DROWNING
                          || c == EntityDamageEvent.DamageCause.SUFFOCATION || c == EntityDamageEvent.DamageCause.FALL
                          || cname.equals("LIGHTNING")) {
                      e.setCancelled(true);
                      return;
                  }
                  // poison and wither
                  if (cname.equals("MAGIC") && (boss.hasEffect(Effect.POISON) || boss.hasEffect(Effect.WITHER))) {
                      boss.removeEffect(Effect.POISON);
                      boss.removeEffect(Effect.WITHER);
                      e.setCancelled(true);
                      return;
                  }
                  // whole fight: no knockback
                  if (e instanceof EntityDamageByEntityEvent) {
                      ((EntityDamageByEntityEvent) e).setKnockBack(0f);
                  }
                  // arrows and other projectiles deal much less damage
                  if (cname.equals("PROJECTILE")) {
                      double cut = Math.max(0, Math.min(100, getConfig().getDouble("boss.arrow-damage-reduction", 70)));
                      e.setDamage(e.getDamage() * (float) ((100 - cut) / 100.0));
                  }
                  // below phase1.hp: arrows, fireballs and wind charges do nothing
                  if (boss.getHealth() < getConfig().getInt("phase1.hp", 1000)) {
                      boolean block = cname.equals("PROJECTILE");
                      if (e instanceof EntityDamageByEntityEvent) {
                          block |= isImmuneSource(((EntityDamageByEntityEvent) e).getDamager());
                      }
                      try {
                          Object child = e.getClass().getMethod("getChild").invoke(e);
                          block |= child instanceof Entity && isImmuneSource((Entity) child);
                      } catch (Throwable ignored) {
                          // not a projectile event
                      }
                      if (block) {
                          e.setCancelled(true);
                      }
                  }
              }

              private boolean isImmuneSource(Entity d) {
                  if (d == null) {
                      return false;
                  }
                  String n = d.getClass().getSimpleName().toLowerCase();
                  return n.contains("arrow") || n.contains("fireball") || n.contains("wind");
              }

              // damage tracking, after other plugins changed the damage
              @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
              public void onDamageRecord(EntityDamageEvent e) {
                  if (phase != PHASE_FIGHT || boss == null || e.getEntity() != boss) {
                      return;
                  }
                  if (e instanceof EntityDamageByEntityEvent) {
                      Entity d = ((EntityDamageByEntityEvent) e).getDamager();
                      if (d instanceof Player) {
                          Player p = (Player) d;
                          damage.merge(p.getName(), (double) e.getFinalDamage(), Double::sum);
                          lastHitter = p.getName();
                      }
                  }
              }

              @EventHandler(priority = EventPriority.HIGHEST)
              public void onDeath(EntityDeathEvent e) {
                  Entity en = e.getEntity();
                  if (minionIds.remove(en.getId())) {
                      e.setDrops(new Item[0]);
                      return;
                  }
                  if (phase == PHASE_FIGHT && boss != null && en == boss) {
                      e.setDrops(new Item[0]);
                      victory();
                  }
              }

              // inside the zone: items and XP are kept on ANY death (kill, poison, mobs), player returns to spawn
              @EventHandler(priority = EventPriority.HIGHEST)
              public void onPlayerDeath(PlayerDeathEvent e) {
                  if (!(e.getEntity() instanceof Player)) {
                      return;
                  }
                  Player p = (Player) e.getEntity();
                  if (!inZone(p)) {
                      return;
                  }
                  e.setKeepInventory(true);
                  e.setKeepExperience(true);
                  sendHome.add(p.getUniqueId());
              }

              @EventHandler(priority = EventPriority.HIGHEST)
              public void onRespawn(PlayerRespawnEvent e) {
                  Player p = e.getPlayer();
                  if (!sendHome.remove(p.getUniqueId())) {
                      return;
                  }
                  Position home = homePosition();
                  if (home != null) {
                      e.setRespawnPosition(home);
                  }
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent e) {
                  UUID id = e.getPlayer().getUniqueId();
                  BarRef ref = bars.remove(id);
                  if (ref != null) {
                      destroyBar(ref);
                  }
              }

              // ------------------------------------------------------------------ admin menu (/aboss)

              private void savePoint(Player p, String key) {
                  getConfig().set(key + ".world", p.getLevel().getFolderName());
                  getConfig().set(key + ".x", Math.round(p.x * 10) / 10.0);
                  getConfig().set(key + ".y", Math.round(p.y * 10) / 10.0);
                  getConfig().set(key + ".z", Math.round(p.z * 10) / 10.0);
                  getConfig().save();
              }

              private void openAdminMenu(Player p) {
                  String state = phase == PHASE_FIGHT ? "босс на арене" : (phase == PHASE_OPEN ? "телепорт открыт" : "ивента нет");
                  FormWindowSimple w = new FormWindowSimple("Админ: Лорд Тьмы", "Сейчас: " + state);
                  w.addButton(new ElementButton("Установить место спавна босса (где я стою)"));
                  w.addButton(new ElementButton("Начать ивент сейчас"));
                  w.addButton(new ElementButton("Заспавнить босса сейчас (телепорт закроется)"));
                  w.addButton(new ElementButton("Убить босса сейчас"));
                  w.addButton(new ElementButton("Лог урона за 30 дней"));
                  w.addButton(new ElementButton("Лог последних ударов за 30 дней"));
                  forms.put(w, 10);
                  p.showFormWindow(w);
              }

              private void adminAction(Player p, int id) {
                  switch (id) {
                      case 0:
                          savePoint(p, "spawn");
                          p.sendMessage(PREFIX + "§aТочка появления босса сохранена: §f" + p.getLevel().getFolderName() + " "
                                  + (int) p.x + " " + (int) p.y + " " + (int) p.z);
                          break;
                      case 1:
                          if (openEvent(false)) {
                              p.sendMessage(PREFIX + "§aИвент начат: телепорт открыт, босс появится через "
                                      + getConfig().getInt("event.spawn-delay-minutes", 5) + " мин.");
                          } else {
                              p.sendMessage(PREFIX + "§cНе удалось начать (ивент уже идёт или в конфиге нет мира ивента).");
                          }
                          break;
                      case 2:
                          if (phase == PHASE_FIGHT) {
                              p.sendMessage(PREFIX + "§cБосс уже на арене.");
                          } else if (spawnNow()) {
                              p.sendMessage(PREFIX + "§aБосс заспавнен, телепортация закрыта.");
                          } else {
                              p.sendMessage(PREFIX + "§cНе удалось заспавнить босса (смотри консоль).");
                          }
                          break;
                      case 3:
                          if (phase != PHASE_FIGHT || boss == null) {
                              p.sendMessage(PREFIX + "§cСейчас босса нет.");
                          } else {
                              killBoss(p);
                          }
                          break;
                      case 4:
                          openLog(p, 11, "Лог урона за " + logDays() + " дней", damageLogText());
                          break;
                      case 5:
                          openLog(p, 12, "Лог последних ударов за " + logDays() + " дней", lastHitLogText());
                          break;
                      default:
                          break;
                  }
              }

              private boolean spawnNow() {
                  if (phase == PHASE_FIGHT) {
                      return false;
                  }
                  if (phase == PHASE_IDLE) {
                      phase = PHASE_OPEN;
                      startMs = System.currentTimeMillis();
                  }
                  if (spawnBoss()) {
                      return true;
                  }
                  phase = PHASE_IDLE;
                  return false;
              }

              // the last hit is counted for the admin who pressed the button
              private void killBoss(Player admin) {
                  Entity b = boss;
                  lastHitter = admin.getName();
                  try {
                      b.kill();
                  } catch (Throwable t) {
                      getLogger().error("boss.kill failed: " + t);
                  }
                  if (phase == PHASE_FIGHT) {
                      victory();
                      if (b != null && !b.isClosed()) {
                          b.close();
                      }
                  }
              }

              private void openLog(Player p, int kind, String title, String text) {
                  FormWindowSimple w = new FormWindowSimple(title, text);
                  w.addButton(new ElementButton("Назад"));
                  forms.put(w, kind);
                  p.showFormWindow(w);
              }

              // ------------------------------------------------------------------ logs (stored in boss-log.json)

              private int logDays() {
                  return Math.max(1, getConfig().getInt("log.days", 30));
              }

              private void loadLog() {
                  log.clear();
                  if (logFile == null || !logFile.exists()) {
                      return;
                  }
                  try (Reader r = new InputStreamReader(Files.newInputStream(logFile.toPath()), StandardCharsets.UTF_8)) {
                      List<Rec> l = gson.fromJson(r, new TypeToken<List<Rec>>() {
                      }.getType());
                      if (l != null) {
                          log.addAll(l);
                      }
                  } catch (Exception ex) {
                      getLogger().error("Cannot read boss-log.json: " + ex);
                  }
              }

              private void saveLog() {
                  long cutoff = System.currentTimeMillis() - logDays() * 86400000L;
                  log.removeIf(r -> r.time < cutoff);
                  try {
                      getDataFolder().mkdirs();
                      try (Writer w = new OutputStreamWriter(Files.newOutputStream(logFile.toPath()), StandardCharsets.UTF_8)) {
                          gson.toJson(log, w);
                      }
                  } catch (Exception ex) {
                      getLogger().error("Cannot save boss-log.json: " + ex);
                  }
              }

              private void recordEvent(boolean killed) {
                  if (damage.isEmpty() && !killed) {
                      return;
                  }
                  Rec r = new Rec();
                  r.time = System.currentTimeMillis();
                  r.killed = killed;
                  r.lastHitter = killed ? lastHitter : null;
                  r.damage = new LinkedHashMap<>(damage);
                  log.add(r);
                  saveLog();
              }

              private String fmtTime(long ms) {
                  return ZonedDateTime.ofInstant(Instant.ofEpochMilli(ms), zone).format(DateTimeFormatter.ofPattern("dd.MM HH:mm"));
              }

              private String damageLogText() {
                  long cutoff = System.currentTimeMillis() - logDays() * 86400000L;
                  Map<String, Double> sum = new LinkedHashMap<>();
                  Map<String, String> display = new HashMap<>();
                  int events = 0;
                  for (Rec r : log) {
                      if (r.time < cutoff) {
                          continue;
                      }
                      events++;
                      for (Map.Entry<String, Double> en : r.damage.entrySet()) {
                          String k = en.getKey().toLowerCase();
                          display.put(k, en.getKey());
                          sum.merge(k, en.getValue(), Double::sum);
                      }
                  }
                  if (events == 0 || sum.isEmpty()) {
                      return "За последние " + logDays() + " дней данных нет.";
                  }
                  List<Map.Entry<String, Double>> list = new ArrayList<>(sum.entrySet());
                  list.sort((a, b) -> Double.compare(b.getValue(), a.getValue()));
                  StringBuilder sb = new StringBuilder("§eИвентов: §f" + events + "\n§eИгроков: §f" + list.size() + "\n\n");
                  int n = 0;
                  for (Map.Entry<String, Double> en : list) {
                      n++;
                      if (n > 50) {
                          sb.append("§7... и ещё ").append(list.size() - 50);
                          break;
                      }
                      sb.append("§e").append(n).append(". §f").append(display.get(en.getKey()))
                              .append(" §7— §c").append((long) (double) en.getValue()).append("\n");
                  }
                  return sb.toString();
              }

              private String lastHitLogText() {
                  long cutoff = System.currentTimeMillis() - logDays() * 86400000L;
                  StringBuilder sb = new StringBuilder();
                  int total = 0;
                  for (int i = log.size() - 1; i >= 0; i--) {
                      Rec r = log.get(i);
                      if (r.time < cutoff || !r.killed || r.lastHitter == null) {
                          continue;
                      }
                      total++;
                      if (total <= 50) {
                          sb.append("§7").append(fmtTime(r.time)).append(" §f— §e").append(r.lastHitter).append("\n");
                      }
                  }
                  if (total == 0) {
                      return "За последние " + logDays() + " дней босса не убивали.";
                  }
                  return "§eУбийств босса: §f" + total + "\n\n" + sb;
              }

              // ------------------------------------------------------------------ command

              @Override
              public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
                  if (command.getName().equalsIgnoreCase("aboss")) {
                      if (!sender.hasPermission("eclips.boss.admin")) {
                          sender.sendMessage("§cНет прав.");
                      } else if (sender instanceof Player) {
                          openAdminMenu((Player) sender);
                      } else {
                          sender.sendMessage("§cТолько в игре.");
                      }
                      return true;
                  }
                  if (!command.getName().equalsIgnoreCase("boss")) {
                      return false;
                  }
                  if (args.length == 0) {
                      if (sender instanceof Player) {
                          openMenu((Player) sender);
                      } else {
                          sender.sendMessage("/boss <start|stop|setspawn|sethome|reload|info>");
                      }
                      return true;
                  }
                  if (!sender.hasPermission("eclips.boss.admin")) {
                      sender.sendMessage("§cНет прав.");
                      return true;
                  }
                  String sub = args[0].toLowerCase();
                  switch (sub) {
                      case "start":
                          if (openEvent(true)) {
                              sender.sendMessage("§aИвент запущен, босс появился сразу.");
                          } else {
                              sender.sendMessage("§cНе удалось запустить (уже идёт или нет мира в конфиге).");
                          }
                          return true;
                      case "stop":
                          if (phase != PHASE_IDLE) {
                              cancelEvent("§cИвент остановлен администратором.");
                              sender.sendMessage("§aИвент остановлен.");
                          } else {
                              sender.sendMessage("§cСейчас ивента нет.");
                          }
                          return true;
                      case "setspawn":
                      case "sethome":
                          if (!(sender instanceof Player)) {
                              sender.sendMessage("§cТолько в игре.");
                              return true;
                          }
                          Player p = (Player) sender;
                          savePoint(p, sub.equals("setspawn") ? "spawn" : "respawn");
                          sender.sendMessage(sub.equals("setspawn")
                                  ? "§aТочка появления босса сохранена."
                                  : "§aТочка возврата после смерти на ивенте сохранена.");
                          return true;
                      case "reload":
                          reloadConfig();
                          loadSettings();
                          sender.sendMessage("§aКонфиг перезагружен.");
                          return true;
                      case "info":
                          if (phase == PHASE_FIGHT && boss != null) {
                              sender.sendMessage("§eБосс активен: §f" + (int) boss.getHealth() + "/" + boss.getMaxHealth()
                                      + " HP, участников: " + damage.size());
                          } else if (phase == PHASE_OPEN) {
                              sender.sendMessage("§eТелепорт открыт, босс ещё не появился.");
                          } else {
                              sender.sendMessage("§7Ивента сейчас нет. Следующий: " + nextOpenText());
                          }
                          return true;
                      default:
                          sender.sendMessage("§e/boss <start|stop|setspawn|sethome|reload|info>");
                          return true;
                  }
              }
          }
          EOF_JAVA

      - name: Build with Maven
        timeout-minutes: 9
        run: mvn -B -Dmaven.artifact.threads=16 -Dmaven.wagon.http.retryHandler.count=3 -Daether.connector.connectTimeout=10000 -Daether.connector.requestTimeout=20000 clean package -f eclips-boss/pom.xml

      - name: Save Maven cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: m2-eclips-boss-${{ github.run_id }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: EclipsBoss
          path: eclips-boss/target/EclipsBoss.jar
